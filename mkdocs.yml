      - "Ayudantía 4 · La inversa de XᵀX por cofactores": ayudantias/ayudantia4.md
      - "Ayudantía · Clases 6 y 7: interpretación e inferencia": ayudantias/ayudantia-clases6y7.md
      - "Ayudantía 11 · Variables binarias y MPL": ayudantias/ayudantia11.md
