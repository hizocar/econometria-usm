# Project information
site_name: Econometría ICS-294
site_author: Sebastian Azocar
site_description: ICS-294 - Econometría (USM) · Trimestre 3, 2026
site_url: https://hizocar.github.io/econometria-usm/

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

# Theme
theme:
  name: material
  language: es
  logo: images/usm_shield.png
  favicon: images/usm_favicon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    # Light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo oscuro

    # Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Cambiar a modo claro

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript (MathJax + simuladores interactivos)
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/econ.js
  - javascripts/casos.js
  - javascripts/casos2.js
  - javascripts/r-run.js

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

# Plugins
plugins:
  - search:
      lang: es

# TOC
nav:
  - Home: index.md
  - Programa: programa.md
  - Calendario: calendario.md
  - Clases:
      - clases/clases.md
      - "Clase 1 · Introducción y repaso de estadística": clases/clase1.md
      - "Clase 2 · Regresión lineal simple": clases/clase2.md
      - "Clase 3 · Causalidad y variable omitida": clases/clase3.md
      - "Clase 4 · Regresión lineal múltiple": clases/clase4.md
      - "Clase 5 · Propiedades estadísticas del estimador MCO": clases/clase5.md
      - "Clase 6 · Interpretación: logaritmos, cuadráticas e interacciones": clases/clase6.md
      - "Clase 7 · Inferencia sobre un parámetro": clases/clase7.md
      - "Clase 8 · Inferencia sobre un conjunto de parámetros": clases/clase8.md
  - Ayudantías:
      - ayudantias/index.md
      - "Ayudantía 1 · Repaso de estadística": ayudantias/ayudantia1.md
      - "Ayudantía 4 · La inversa de XᵀX por cofactores": ayudantias/ayudantia4.md
