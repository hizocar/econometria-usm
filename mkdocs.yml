# Project information
site_name: Econometría ICS-294
site_author: Sebastian Azocar
site_description: ICS-294 - Econometría (USM) · Trimestre 3, 2026
site_url: https://hizocar.github.io/econometria-usm/

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

# Theme
theme:
  name: material
  language: es
  logo: images/usm_shield.png
  favicon: images/usm_favicon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    # Light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Cambiar a modo oscuro

    # Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Cambiar a modo claro

# Extra CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/practica.css

# Extra JavaScript (MathJax + simuladores interactivos)
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/econ.js
  - javascripts/casos.js
  - javascripts/casos2.js
  - javascripts/r-run.js
  - javascripts/practica-banco.js
  - javascripts/practica-banco2.js
  - javascripts/practica-banco3.js
  - javascripts/practica2.js
  - javascripts/practica2-extra.js
  - javascripts/practica3-comentes.js
  - javascripts/practica3.js
  - javascripts/cuentas.js
  - javascripts/admin.js
  - javascripts/quiz.js
  - javascripts/practica.js

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

# Plugins
plugins:
  - search:
      lang: es

# TOC
nav:
